name: npm beta binary packages

on:
  workflow_dispatch:

jobs:
  launcher-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:validate-npm
      - name: Pack launcher package
        shell: bash
        run: |
          mkdir -p .release/artifacts
          npm pack packages/npm/kairn --pack-destination .release/artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-launcher-usekairn
          path: .release/artifacts/*.tgz
          if-no-files-found: error

  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            binary: kairn
            full-tests: true
          - os: ubuntu-latest
            target: linux-x64
            binary: kairn
            full-tests: true
          - os: ubuntu-24.04-arm
            target: linux-arm64
            binary: kairn
            full-tests: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild better-sqlite3
      - if: matrix.full-tests
        run: pnpm exec vitest run --testTimeout=45000
      - run: pnpm typecheck
      - run: pnpm build
      - name: Build platform binary
        shell: bash
        run: |
          pnpm release:build-binary -- --target "${{ matrix.target }}" --out ".release/binaries/${{ matrix.target }}/${{ matrix.binary }}"
      - name: Stage platform package
        shell: bash
        run: |
          pnpm release:stage-platform -- --target "${{ matrix.target }}" --binary ".release/binaries/${{ matrix.target }}/${{ matrix.binary }}" --out-dir ".release/npm"
      - name: Pack platform package artifact
        shell: bash
        run: |
          mkdir -p .release/artifacts
          npm pack ".release/npm/kairn-${{ matrix.target }}" --pack-destination ".release/artifacts"
      - name: Smoke binary
        shell: bash
        run: |
          ".release/npm/kairn-${{ matrix.target }}/bin/${{ matrix.binary }}" --version
          tmp="$(mktemp -d)"
          ".release/npm/kairn-${{ matrix.target }}/bin/${{ matrix.binary }}" doctor --root "$tmp/repo" --json
          mkdir -p "$tmp/repo"
          printf 'export const value = 1;\n' > "$tmp/repo/index.ts"
          ".release/npm/kairn-${{ matrix.target }}/bin/${{ matrix.binary }}" index refresh --root "$tmp/repo" --json
      - uses: actions/upload-artifact@v4
        with:
          name: npm-platform-${{ matrix.target }}
          path: .release/artifacts/*.tgz
          if-no-files-found: error
